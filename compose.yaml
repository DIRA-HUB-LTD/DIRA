# Local development database only. Start everything with: npm run demo
# The schema and all migrations are applied by `npm run db:migrate`
# (scripts/migrate.mjs + db/manifest.mjs), not by init scripts, so new
# migrations reach existing local databases too.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dira_dev
      POSTGRES_USER: dira_dev
      POSTGRES_PASSWORD: dira_local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dira-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dira_dev -d dira_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dira-postgres-data:
